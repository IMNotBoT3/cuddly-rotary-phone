name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 35
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.9"
          cache-provider: basic

      - name: Check project
        run: |
          echo "Repository contents:"
          ls -la
          echo "Android contents:"
          ls -la android
          echo "Gradle version:"
          gradle --version
          echo "SDK Manager:"
          which sdkmanager

      - name: Build Android APK
        working-directory: android
        run: gradle :app:assembleDebug --stacktrace

      - name: Rename APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk LaptopKeyboardBridge.apk

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: LaptopKeyboardBridge-APK
          path: LaptopKeyboardBridge.apk
          if-no-files-found: error
